apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - docs.localhost
      secretName: docs-tls
  rules:
    - host: docs.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 80
