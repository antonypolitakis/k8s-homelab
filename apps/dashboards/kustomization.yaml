apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true   # no pod mounts it, so no need for hash-triggered rollouts
  labels:
    grafana_dashboard: "1"      # Grafana's sidecar picks up anything with this label
configMapGenerator:
  - name: dashboard-podinfo
    files:
      - podinfo-dashboard.json
