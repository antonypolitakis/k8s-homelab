apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antonypolitakis/k8s-homelab.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd          # Application objects live in the argocd namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
